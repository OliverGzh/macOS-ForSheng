name: Complete upstream import

on:
  push:
    branches: ["27.3"]
    paths: [".github/workflows/import-upstream.yml"]

permissions:
  contents: write

concurrency:
  group: complete-upstream-import
  cancel-in-progress: false

jobs:
  import:
    if: github.repository == 'OliverGzh/macOS-ForSheng'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Back up and import the complete pinned device tree
        env:
          IMPORT_OVERLAY: 
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch --depth=1 origin 145582b5c85f7422454fb30045893e44979d322f
          git push origin 145582b5c85f7422454fb30045893e44979d322f:refs/heads/archive/pre-upstream-2026-11-15
          git fetch --depth=1 https://github.com/UniXNU/UniXNU-sheng.git 9ae0df2cc6666b03b83a0ca6d5691606b9024c4f
          test "$(git rev-parse FETCH_HEAD)" = 9ae0df2cc6666b03b83a0ca6d5691606b9024c4f
          git read-tree --reset -u 9ae0df2cc6666b03b83a0ca6d5691606b9024c4f
          python3 - <<'PY'
          import base64, json, os, pathlib
          files = json.loads(base64.b64decode(os.environ['IMPORT_OVERLAY']))
          assert set(files) == {'README.md', 'UPSTREAM.md'}
          for path, content in files.items():
              pathlib.Path(path).write_text(content, encoding='utf-8', newline=chr(10))
          PY
          git add README.md UPSTREAM.md
          test "$(git write-tree)" = b4d5816311cd412f2a5868c6e71eaff234ddf14e
          # Keep the UI-installed workflows byte-for-byte for this one-time run.
          git restore --source="$GITHUB_SHA" --staged --worktree .github/workflows
          python3 - <<'PY'
          import subprocess, tomllib
          changed = subprocess.check_output(['git', 'diff', '--cached', '--name-only', '9ae0df2cc6666b03b83a0ca6d5691606b9024c4f']).decode().splitlines()
          assert set(changed) == {'README.md', 'UPSTREAM.md', '.github/workflows/import-upstream.yml'}, changed
          for path in subprocess.check_output(['git','ls-files','*.toml']).decode().splitlines():
              with open(path, 'rb') as f:
                  tomllib.load(f)
          links = [line for line in subprocess.check_output(['git','ls-files','--stage']).decode().splitlines() if line.startswith('160000 ')]
          assert len(links) == 7, links
          print('Full source integrity: 521 upstream entries and seven driver gitlinks; two documentation overlays.')
          PY
          git diff --cached --check 9ae0df2cc6666b03b83a0ca6d5691606b9024c4f -- README.md UPSTREAM.md
      - name: Resolve the actual macOS 27.3 configuration
        run: |
          set -euo pipefail
          framework_dir="$RUNNER_TEMP/UniXNU"
          git init "$framework_dir"
          git -C "$framework_dir" fetch --depth=1 https://github.com/UniXNU/UniXNU.git 0c1bac3d51a3009dca1708b15a5198f4b43d057a
          git -C "$framework_dir" checkout --detach FETCH_HEAD
          python3 "$framework_dir/unixnu" defconfig sheng_macos_defconfig -D "$GITHUB_WORKSPACE" --os macos-27.3-26C5035r
          python3 "$framework_dir/unixnu" status -D "$GITHUB_WORKSPACE" --os macos-27.3-26C5035r --json > "$RUNNER_TEMP/macos27-status.json"
          python3 - <<'PY'
          import json, os, pathlib
          r = json.loads((pathlib.Path(os.environ['RUNNER_TEMP'])/'macos27-status.json').read_text())
          assert pathlib.Path(r['profiles']['os']).name == 'macos-27.3-26C5035r', r['profiles']
          print('Resolved macOS 27.3 / 26C5035r using the upstream CLI.')
          PY
      - name: Publish the replacement without force-pushing
        run: |
          set -euo pipefail
          # Re-add only the import overlay; generated locks are not published.
          git commit -m 'Replace the legacy port with the complete pinned UniXNU sheng project'
          git push origin HEAD:refs/heads/27.3
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: complete-upstream-import-validation
          path: ${{ runner.temp }}/macos27-status.json
